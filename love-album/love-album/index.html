<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For You</title>
  <meta name="theme-color" content="#f3c9d4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="book is-closed" id="book" aria-live="polite"></div>
    <p class="hint" id="hint"></p>
    <nav class="controls" id="controls" hidden>
      <button id="prev" aria-label="Previous page">&#10094;</button>
      <span id="count"></span>
      <button id="next" aria-label="Next page">&#10095;</button>
    </nav>
  </main>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
